<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="站点公告">
  <title>公告</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236366f1'/%3E%3Ccircle cx='50' cy='40' r='14' fill='white'/%3E%3Crect x='36' y='60' width='28' height='12' rx='6' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('blog-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="site-header"></div>

  <main class="announcement-page">
    <h1>📢 公告</h1>
    <div id="announcement-list"></div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/markdown.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    App.initTheme();
    App.renderHeader('announcement.html');
    App.renderFooter();
    App.initAuth();
    (async function () {
      document.title = '公告 · ' + (SITE.name || '博客');
      var list = document.getElementById('announcement-list');
      await App.loadAnnouncements();
      var anns = (SITE.announcements || []).slice().sort(function (a, b) {
        return (b.date || '').localeCompare(a.date || '');
      });
      if (!anns.length) {
        list.innerHTML = '<div class="empty">暂无公告。</div>';
        return;
      }
      list.innerHTML = anns.map(function (a) {
        return '<div class="announcement-card">' +
          '<div class="announcement-card-text">' + App.esc(a.text) + '</div>' +
          '<time class="announcement-card-date">' + App.formatDate(a.date) + '</time>' +
        '</div>';
      }).join('');
    })();
  </script>
</body>
</html>
