<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一个纯静态的个人博客：Markdown 写作、标签分类、全文搜索、深色模式、评论与 RSS 订阅。">
  <title>我的博客</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236366f1'/%3E%3Ccircle cx='50' cy='40' r='14' fill='white'/%3E%3Crect x='36' y='60' width='28' height='12' rx='6' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    // 尽早设置主题，避免闪烁
    (function () {
      try {
        var t = localStorage.getItem('blog-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="site-header"></div>

  <section class="hero">
    <div class="announcement-anchor" id="announcement-anchor"></div>
    <div class="hero-inner">
      <h1 id="hero-name">我的博客</h1>
      <p class="slogan" id="hero-slogan">记录思考，分享热爱</p>
      <p class="desc" id="hero-desc"></p>
    </div>
    <a class="scroll-down" href="#posts" aria-label="下滑查看文章">
      <span class="scroll-text">下滑查看文章</span>
      <span class="scroll-arrow">↓</span>
    </a>
  </section>

  <div class="main" id="posts">
    <div>
      <div class="section-title" id="result-count">共 0 篇文章</div>
      <div class="post-list" id="post-list"></div>
    </div>
    <aside class="sidebar">
      <div class="widget">
        <h3>🏷️ 标签</h3>
        <div id="tag-list"></div>
      </div>
      <div class="widget">
        <h3>📁 分类</h3>
        <div id="category-list"></div>
      </div>
    </aside>
  </div>

  <div id="site-footer"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/posts.js"></script>
  <script src="assets/js/markdown.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/home.js"></script>
  <script>
    App.initTheme();
    App.renderHeader('index.html');
    App.renderFooter();
    App.initAuth();
    App.renderAnnouncement(document.getElementById('announcement-anchor'));
    Home.init();
  </script>
</body>
</html>
